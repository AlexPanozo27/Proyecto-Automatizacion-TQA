[pytest]
testpaths = tests
addopts = -p no:cacheprovider
markers =
    smoke: pruebas de humo (lo esencial funciona)
    sanity: verificación rápida tras un cambio
    regression: regresión completa
    integration: integración entre módulos (RFID, alertas, API)
    e2e: extremo a extremo en el navegador (Playwright)
    performance: rendimiento (tiempos de respuesta)
    estres: estrés (muchas peticiones simultáneas)
    soak: resistencia (carga sostenida en el tiempo)
    retest: retesting de defectos reportados (BUG-001 a BUG-005)
    ia: casos generados con el asistente de IA
    seguridad: pruebas de seguridad (auditoría SHA-256, fuerza bruta, 2FA, inyección SQL, sesiones, datos sensibles)
    autocuracion: demostración de autocuración con IA (locator de una versión anterior del panel)
